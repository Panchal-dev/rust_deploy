[package]
name = "cf-bypass-rust"
version = "0.1.0"
edition = "2021"
description = "Fast Cloudflare IUAM + Turnstile solver in Rust, Railway-ready"

# NOTE: rust-version intentionally omitted.
# chaser-cf's transitive deps pull in icu_* / uuid / textwrap which
# require rustc >= 1.88/1.89. The Dockerfile pins `rust:1.90-slim-bookworm`
# explicitly, so we don't declare a rust-version here to avoid cargo
# trying to resolve older compatible versions.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["future"] }
url = "2"
thiserror = "2"
chaser-cf = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true